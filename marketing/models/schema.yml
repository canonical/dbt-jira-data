version: 2

models:
  - name: opportunity_contract
    description: lists the contracts with linked opportunities
    columns:
    - name: id
      description: salesforce id
    - name: accountid
      description: associated account id
  - name: contract_opportunity
    description: lists the opportunities with linked contracts
    columns:
    - name: amount
      description: opportunity amount
    - name: stagename
      description: opportunity stage name 
    - name: contractterm
      description: contract term

sources:
  - name: marketing
    database: marketing
    schema: public
    loaded_at_field: createddate
    freshness:
        warn_after: {count: 12, period: hour}
    tables:
      - name: salesforce_opportunity
      - name: salesforce_leadhistory
      - name: salesforce_lead
      - name: salesforce_contact
        freshness:
          warn_after: {count: 1, period: day}
      - name: salesforce_account
        freshness:
          warn_after: {count: 1, period: day}
      - name: salesforce_user
        freshness:
          null
      - name: salesforce_userrole
        freshness:
          null
      - name: salesforce_campaign
        loaded_at_field: lastmodifieddate
        freshness:
          warn_after: {count: 1, period: day}
      - name: salesforce_campaignmember
        freshness:
          warn_after: {count: 1, period: day}
    
  - name: sales
    database: sales
    schema: public
    tables:
    - name: salesforce_contract
    loaded_at_field: createddate
    freshness:
      warn_after: {count: 12, period: hour}
