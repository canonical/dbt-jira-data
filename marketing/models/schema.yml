version: 2

models:
  - name: opportunity_contract
    description: lists the contracts with linked opportunities
    columns:
      - name: id
        description: salesforce id
      - name: accountid
        description: associated account id
  - name: contract_opportunity
    description: lists the opportunities with linked contracts
    columns:
      - name: amount
        description: opportunity amount
      - name: stagename
        description: opportunity stage name
      - name: contractterm
        description: contract term
  - name: sf_accounts_industry_mapping
    description: mapping table for account industries and bucketing them
    columns:
      - name: industry
        description: the distinct industries from the salesforce_account table
        data_tests:
          - unique
          - not_null
      - name: industry_bucket
        description: the bucket name for the industries, generated by regular expression matching
        data_tests:
          - not_null
  - name: sf_accounts_owner_role_mapping
    description: mapping table for salesforce account owner roles
    columns:
      - name: name
        description: the distinct name of the owner role from the salesforce_account table
        data_tests:
          - unique
          - not_null
      - name: name_bucket
        description: the bucket names for the owner roles, generated by regular expression matching
        data_tests:
          - not_null
  - name: sf_accounts_with_owners_and_verticals
    description: mapping table for salesforce account owner roles
    columns:
      - name: name
        description: the distinct name of the owner role from the salesforce_account table
        data_tests:
          - unique
          - not_null
      - name: name_bucket
        description: the bucket names for the owner roles, generated by regular expression matching
        data_tests:
          - not_null
  - name: sf_accounts_with_owners_and_verticals
    description: 'salesforce accounts in full with owners and owner roles, bucketed owner roles and industries'
    columns:
    - name: id
      description: 'unique identifier for the account record'
      data_tests:
          - unique
          - not_null
    - name: planhat_sync__c
      description: 'indicates if the account is synced with Planhat'
    - name: isdeleted
      description: 'flag indicating whether the record is deleted'
    - name: billinglatitude
      description: 'latitude of the billing address'
    - name: billinglongitude
      description: 'longitude of the billing address'
    - name: billingaddress
      description: 'full billing address of the account'
    - name: shippinglatitude
      description: 'latitude of the shipping address'
    - name: shippinglongitude
      description: 'longitude of the shipping address'
    - name: shippingaddress
      description: 'full shipping address of the account'
    - name: annualrevenue
      description: 'reported annual revenue of the account'
    - name: annualrevenue__converted
      description: 'annual revenue converted to a standardized currency'
    - name: numberofemployees
      description: 'total number of employees in the organization'
    - name: createddate
      description: 'timestamp of when the account was created'
    - name: lastmodifieddate
      description: 'timestamp of the last modification to the account'
    - name: systemmodstamp
      description: 'system-generated timestamp for the last record update'
    - name: lastactivitydate
      description: 'date of the last recorded activity related to the account'
    - name: lastvieweddate
      description: 'timestamp of the last time the record was viewed'
    - name: lastreferenceddate
      description: 'timestamp of the last time the record was referenced'
    - name: ispartner
      description: 'indicates if the account is a partner'
    - name: iscustomerportal
      description: 'indicates if the account has a customer portal enabled'
    - name: ispersonaccount
      description: 'flag to indicate if the account is a person account'
    - name: personmailinglatitude
      description: 'latitude of the person’s mailing address'
    - name: personmailinglongitude
      description: 'longitude of the person’s mailing address'
    - name: personmailingaddress
      description: 'full mailing address of the person account'
    - name: personotherlatitude
      description: 'latitude of the alternate address for the person account'
    - name: personotherlongitude
      description: 'longitude of the alternate address for the person account'
    - name: personotheraddress
      description: 'alternate address of the person account'
    - name: personbirthdate
      description: 'birthdate of the person account'
    - name: personhasoptedoutofemail
      description: 'indicates if the person has opted out of email communications'
    - name: persondonotcall
      description: 'indicates if the person has opted out of phone calls'
    - name: personlastcurequestdate
      description: 'date of the last CU request for the person account'
    - name: personlastcuupdatedate
      description: 'date of the last CU update for the person account'
    - name: personemailbounceddate
      description: 'timestamp of the last email bounce for the person account'
    - name: power_of_one__c
      description: 'a formula field used for reporting purposes'
    - name: open_opps__c
      description: 'number of open opportunities related to the account'
    - name: dlrs_activities_last_90_days__c
      description: 'number of activities in the last 90 days'
    - name: account_active__c
      description: 'indicates if the account is active'
    - name: count__c
      description: 'custom counter field for various calculations'
    - name: closed_won_opps__c
      description: 'number of closed-won opportunities related to the account'
    - name: country_is_valid__c
      description: 'indicates if the country information is valid'
    - name: state_is_valid__c
      description: 'indicates if the state information is valid'
    - name: technical_representatives__c
      description: ''
    - name: arr_value__c
      description: 'annual recurring revenue value of the account'
    - name: arr_value__c__converted
      description: 'converted annual recurring revenue value'
    - name: max_technical_representatives__c
      description: ''
    - name: confidential__c
      description: 'indicates if the account is confidential'
    - name: account_in_play__c
      description: 'indicates if the account is currently in play'
    - name: most_recent_opportunity__c
      description: 'reference to the most recent opportunity associated with the account'
    - name: is_esm_provisioning__c
      description: ''
    - name: name_change_restricted__c
      description: 'indicates if the account name change is restricted'
    - name: earliest_sale__c
      description: ''
    - name: account_based_marketing__c
      description: 'indicates if the account is part of an ABM program'
    - name: active_asset_count__c
      description: 'count of active assets associated with the account'
    - name: salesloft1__active_account__c
      description: 'indicates if the account is active in SalesLoft'
    - name: do_not_record_calls__c
      description: 'indicates if calls should not be recorded for the account'
    - name: dozisf__zoominfo_first_updated__c
      description: 'timestamp of the first ZoomInfo update for the account'
    - name: dozisf__zoominfo_last_updated__c
      description: 'timestamp of the last ZoomInfo update for the account'
    - name: account_score__c
      description: 'scoring metric for the account'
    - name: accountsource
      description: 'source from which the account was acquired'
    - name: sicdesc
      description: ''
    - name: mediator_organisation_id__c
      description: ''
    - name: esm_username_archive__c
      description: ''
    - name: account_type__c
      description: 'indicating the type of account'
    - name: support_notes__c
      description: 'notes related to support cases for the account'
    - name: esm_username__c
      description: ''
    - name: alliance_type__c
      description: ''
    - name: duns_number__c
      description: ''
    - name: leandata__search__c
      description: 'LeanData search field for routing purposes'
    - name: region__c
      description: 'region associated with the account'
    - name: account_value_segment__c
      description: ''
    - name: governing_fsa__c
      description: ''
    - name: geography__c
      description: 'geographic region of the account.'
    - name: account_status__c
      description: ''
    - name: ld_partner_program_tier__c
      description: ''
    - name: vat_number__c
      description: 'VAT number for tax and invoicing purposes'
    - name: industry
      description: 'industry category of the account'
    - name: account_owner__c
      description: 'owner of the account record'
    - name: recordtypeid
      description: ''
    - name: enr_account_owner_role
      description: 'enhanced role designation for the account owner'
    - name: enr_account_owner_role_buckets
      description: 'categorized role bucket for account owner roles'
    - name: enr_account_vertical
      description: 'the bucketed industry for the account'


sources:
  - name: marketing
    database: marketing_developer
    schema: public
    loaded_at_field: createddate
    freshness:
      warn_after: { count: 12, period: hour }
    tables:
      - name: salesforce_opportunity
      - name: salesforce_leadhistory
      - name: salesforce_lead
      - name: salesforce_contact
        freshness:
          warn_after: { count: 1, period: day }
      - name: salesforce_account
        freshness:
          warn_after: { count: 1, period: day }
      - name: salesforce_user
        freshness: null
      - name: salesforce_userrole
        freshness: null
      - name: salesforce_campaign
        loaded_at_field: lastmodifieddate
        freshness:
          warn_after: { count: 1, period: day }
      - name: salesforce_campaignmember
        freshness:
          warn_after: { count: 1, period: day }

  - name: sales
    database: sales
    schema: public
    tables:
      - name: salesforce_contract
    loaded_at_field: createddate
    freshness:
      warn_after: { count: 12, period: hour }
