version: 2

models:
  - name: movies_per_country
    description: Number of movies per country on Apple, Amazon, Netflix, and HBO
    columns:
      - name: num_apple_movies
        description: Number of movies on Apple TV
      - name: num_amazon_movies
        description: Number of movies on Amazon Prime Video
      - name: num_netflix_movies
        description: Number of movies on Netflix
      - name: num_hbo_movies
        description: Number of movies on HBO Max
      - name: country
        description: Country name
        data_tests:
          - unique
          - not_null

unit_tests:
  - name: check_number_of_movies_per_country
    model: movies_per_country
    description: "Check that the number of movies per country is correct"
    given:
      - input: ref('countries')
        rows:
          - {country_code: 'US', name: 'United States'}
          - {country_code: 'BR', name: 'Brazil'}
          - {country_code: 'CA', name: 'Canada'}
      - input: ref('apple_movies')
        rows:
          - {country: 'US', title: 'The Shawshank Redemption'}
          - {country: 'US', title: 'The Godfather'}
          - {country: 'US', title: 'The Godfather: Part II'}
          - {country: 'BR', title: 'The Godfather: Part III'}
          - {country: 'BR', title: 'Cidade de Deus'}
      - input: ref('amazon_movies')
        rows:
          - {country: 'US', title: 'The Shawshank Redemption'}
          - {country: 'US', title: 'The Godfather'}
          - {country: 'BR', title: 'Cidade de Deus'}
      - input: ref('netflix_movies')
        rows:
          - {country: 'US', title: 'The Shawshank Redemption'}
          - {country: 'US', title: 'The Godfather'}
      - input: ref('hbo_movies')
        rows:
          - {country: 'US', title: 'The Shawshank Redemption'}
          - {country: 'US', title: 'The Godfather'}
          - {country: 'CA', title: 'The Godfather: Part II'}
    expect:
      rows:
        - num_apple_movies: 3,
          num_amazon_movies: 2,
          num_netflix_movies: 2,
          num_hbo_movies: 2,
          country: 'United States'
        - num_apple_movies: 2
          num_amazon_movies: 1
          num_netflix_movies: 0
          num_hbo_movies: 0
          country: 'Brazil'
        - num_apple_movies: 0
          num_amazon_movies: 0
          num_netflix_movies: 0
          num_hbo_movies: 1
          country: 'Canada'
