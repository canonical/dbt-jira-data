version: 2

models:
  - name: movies_per_country
    description: Number of movies per country on Apple, Amazon, Netflix, and HBO
    columns:
      - name: num_netflix_movies
        description: Number of movies on Netflix
      - name: country
        description: Country name
        data_tests:
          - unique
          - not_null

unit_tests:
  - name: check_number_of_movies_per_country
    model: movies_per_country
    description: "Check that the number of movies per country is correct"
    given:
      # We can use JSON formatted data as the sample input
      - input: ref('stg_countries__countries')
        format: dict
        rows:
          - {country_code: 'US', name: 'United States'}
          - {country_code: 'BR', name: 'Brazil'}
          - {country_code: 'IT', name: 'Italy'}

      # For ephemeral models, we must specify it as a SQL query
      - input: ref('int_netflix_crossed_countries')
        format: sql
        rows: |
          select * from (
          values
            ('US', 'The Shawshank Redemption'),
            ('US', 'The Godfather'),
            ('BR', 'City of God')
          ) as t(country_code, title)

    expect:
      rows:
        - num_netflix_movies: 2
          country: 'United States'
        - num_netflix_movies: 1
          country: 'Brazil'
        # Our model is configured to not include countries with no movies,
        # so Italy doesn't appear (negative test?).
