version: 2

models:
  - name: stg_countries__countries
    description: Country codes and names, extracted from seed.
    columns:
      - name: country_code
        description: Country's ISO 3166-1 alpha-2 code
        data_tests:
          - unique
          - not_null
      - name: name
        description: Country's name in English

unit_tests:
  - name: check_countries
    model: stg_countries__countries
    description: "Check that the country codes and names are correct"
    given:
      - input: ref('country_codes')
        rows:
          - {alpha-2: 'US', name: 'United States'}
          - {alpha-2: 'BR', name: 'Brazil'}
    expect:
      rows:
        - {country_code: 'US', name: 'United States'}
        - {country_code: 'BR', name: 'Brazil'}
