schedules:
  - name: dbt_trino_stg__countries__daily
    model: countries
    interval: hourly
    env:
      - staging
  - name: dbt_trino_prod__movies_per_country__weekly
    model: +movies_per_country
    interval: weekly
    env:
      - production
  - name: your_other_model
    model: parent_a parent_b your_other_model
    interval: "* 17 * * *" # Run daily at 17:00 UTC
    env:
      - staging
