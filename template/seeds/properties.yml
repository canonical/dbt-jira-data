version: 2

seeds:
  - name: country_codes
    description: "A list of countries and their ISO 3166-1 alpha-2 codes."
    docs:
      show: true
    columns:
      - name: name
        data_type: varchar(100)
      - name: alpha_2
        data_type: char(2)
  - name: netflix
    description: "A list of Netflix titles."
    docs:
      show: true
    columns:
      - name: imdbid
        data_type: varchar(10)
      - name: title
        data_type: varchar(100)
      - name: avaliablecountries
        data_type: varchar(1000)
      - name: type
        data_type: varchar(100)
