version: 2

models:
  - name: issues
    description: "Issues with flattened fields and the first committed sprint."

    config:
      contract: {enforced: true}

    columns:
      - name: issue_id
        description: "Jira internal issue ID (primary key)."
        data_type: bigint
        constraints:
          - type: primary_key
            warn_unsupported: false
          - type: not_null
          - type: unique
            warn_unsupported: false
        tests: [not_null, unique]

      - name: issue_key
        description: "Jira issue key, e.g. PROJ-123 (unique)."
        data_type: varchar
        constraints:
          - type: unique
            warn_unsupported: false
        tests: [not_null, unique]

      - name: issue_type
        data_type: varchar
        description: "Issue type name."
        tests: [not_null]

      - name: summary
        data_type: varchar
        description: "Issue summary/title."
        tests: [not_null]

      - name: priority
        data_type: varchar
        description: "Priority name."

      - name: reporter
        data_type: varchar
        description: "Reporter (display name)."

      - name: assignee
        data_type: varchar
        description: "Assignee (display name)."

      - name: status
        data_type: varchar
        description: "Current status."
        tests: [not_null]

      - name: created_at
        data_type: timestamp with time zone
        description: "Issue created timestamp."
        tests: [not_null]

      - name: resolved_at
        data_type: timestamp with time zone
        description: "Resolution timestamp, if resolved."

      - name: story_points
        data_type: double
        description: "Story points (customfield_10024)."

      - name: first_committed_sprint_id
        data_type: bigint
        constraints:
          - type: foreign_key
            to: ref('sprints')
            to_columns: [sprint_id]
            warn_unsupported: false

      - name: project_key
        data_type: varchar
        description: "Project key."
        tests: [not_null]

      - name: project
        data_type: varchar
        description: "Project name."

  - name: issue_labels
    description: "Normalized labels for Jira issues (one row per issue_id + label)."

    config:
      contract: {enforced: true}

    constraints:
      - type: unique
        columns: [issue_id, label]
        warn_unsupported: false

    columns:
      - name: issue_id
        data_type: bigint
        description: "Jira internal issue ID."
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('issues')
            to_columns: [issue_id]
            warn_unsupported: false

      - name: label
        data_type: varchar
        description: "Single label assigned to the issue."
        constraints:
          - type: not_null

  - name: sprints
    description: "Sprints"

    config:
      contract: {enforced: true}

    columns:
      - name: sprint_id
        description: "Sprint ID (primary key)."
        data_type: bigint
        constraints:
          - type: not_null
          - type: unique
            warn_unsupported: false
          - type: primary_key
            warn_unsupported: false
        tests: [not_null, unique]

      - name: name
        data_type: varchar
        description: "Sprint name."
        tests: [not_null]

      - name: original_name
        data_type: varchar
        description: "Original sprint name"
        tests: [not_null]

      - name: state
        data_type: varchar
        description: "Sprint state."
        constraints:
          - type: check
            expression: "state in ('future','active','closed')"
            warn_unsupported: false
        tests:
          - not_null
          - accepted_values:
              values: ["future", "active", "closed"]

      - name: started_at
        data_type: timestamp with time zone
        description: "Sprint start datetime."

      - name: completed_at
        data_type: timestamp with time zone
        description: "Sprint completion datetime."

  - name: issue_sprint_links
    description: "Issue to sprint links. One row per (issue_id, sprint_id)."

    config:
      contract: {enforced: true}

    constraints:
      - type: unique
        columns: [issue_id, sprint_id]
        warn_unsupported: false

    columns:
      - name: issue_id
        data_type: bigint
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('issues')
            to_columns: [issue_id]
            warn_unsupported: false

      - name: sprint_id
        data_type: bigint
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('sprints')
            to_columns: [sprint_id]
            warn_unsupported: false

      - name: added_at
        data_type: timestamp with time zone
        description: "First time the issue was added to the sprint (can be null if not derivable from history)."

  - name: issue_status_histories
    description: "Status change events per issue."

    config:
      contract: {enforced: true}

    columns:
      - name: issue_id
        data_type: bigint
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('issues')
            to_columns: [issue_id]
            warn_unsupported: false

      - name: issue_key
        data_type: varchar
        description: "Issue key."
        tests: [not_null]

      - name: changed_at
        data_type: timestamp with time zone
        description: "Timestamp of the status change."
        tests: [not_null]

      - name: from_status
        data_type: varchar
        description: "Previous status."

      - name: to_status
        data_type: varchar
        description: "New status."

  - name: issue_sprint_histories
    description: "Sprint field change events per issue."

    config:
      contract: {enforced: true}

    columns:
      - name: issue_id
        data_type: bigint
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('issues')
            to_columns: [issue_id]
            warn_unsupported: false

      - name: issue_key
        data_type: varchar
        description: "Issue key."
        tests: [not_null]

      - name: changed_at
        data_type: timestamp with time zone
        description: "Timestamp of the sprint field change."
        tests: [not_null]

      - name: from_string
        data_type: varchar
        description: "FROM sprint value."

      - name: to_string
        data_type: varchar
        description: "TO sprint value."

      - name: from_id
        data_type: varchar
        description: "FROM sprint ID value."

      - name: to_id
        data_type: varchar
        description: "TO sprint ID value."

  - name: efficiency
    description: "A consolidated view of stories delivered
      and bugs opened within each sprint, used to calculate efficiency metrics."

    config:
      contract: {enforced: true}

    columns:
      - name: sprint_id
        description: "Sprint ID (foreign key)."
        data_type: bigint
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('sprints')
            to_columns: [sprint_id]
            warn_unsupported: false
        tests:
          - not_null
          - relationships:
              to: ref('sprints')
              field: sprint_id
              severity: warn

      - name: sprint_name
        description: "Sprint name."
        data_type: varchar
        tests: [not_null]

      - name: started_at
        description: "Sprint start datetime."
        data_type: timestamp with time zone

      - name: issue_id
        description: "Issue ID (foreign key)."
        data_type: bigint
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('issues')
            to_columns: [issue_id]
            warn_unsupported: false
        tests:
          - not_null
          - relationships:
              to: ref('issues')
              field: issue_id
              severity: warn

      - name: summary
        description: "Issue summary/title."
        data_type: varchar
        tests: [not_null]

      - name: project
        description: "Project name."
        data_type: varchar

      - name: metric_type
        description: "Type of metric ('delivered_story' or 'opened_bug')."
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              values: ["delivered_story", "opened_bug"]

  - name: opened_vs_closed_bugs
    description: "Tracks bugs that were either opened or closed within each sprint.
     A bug may appear twice if it was both opened and closed in the same sprint."

    config:
      contract: {enforced: true}

    columns:
      - name: sprint_id
        description: "The ID of the sprint in which the bug was opened or closed."
        data_type: bigint
        constraints:
          - type: not_null
          - type: foreign_key
            to: ref('sprints')
            to_columns: [sprint_id]
            warn_unsupported: false
        tests:
          - not_null
          - relationships:
              to: ref('sprints')
              field: sprint_id
              severity: warn

      - name: sprint_name
        description: "The name of the sprint."
        data_type: varchar
        tests: [not_null]

      - name: issue_url
        description: "A clickable HTML link to the Jira issue."
        data_type: varchar
        tests: [not_null]

      - name: summary
        description: "Issue summary/title."
        data_type: varchar
        tests: [not_null]

      - name: project
        description: "Project name."
        data_type: varchar

      - name: created_at
        description: "Timestamp when the bug was created."
        data_type: timestamp with time zone
        tests: [not_null]

      - name: resolved_at
        description: "Timestamp when the bug was resolved. Can be null."
        data_type: timestamp with time zone

      - name: priority
        description: "Priority of the bug."
        data_type: varchar

      - name: status
        description: "Indicates if the record represents an 'opened' or 'closed' event within the sprint."
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              values: ["opened", "closed"]

  - name: project_correctness_and_performance
    description: "Lists all bugs that were active during a sprint.
     A bug is considered active if it was created before the sprint ended
     and was either unresolved or resolved after the sprint started."

    config:
      contract: {enforced: true}

    columns:
      - name: sprint_name
        description: "Name of the sprint."
        data_type: varchar
        tests: [not_null]

      - name: issue_url
        description: "A clickable HTML link to the Jira bug."
        data_type: varchar
        tests: [not_null]

      - name: summary
        description: "Issue summary/title."
        data_type: varchar
        tests: [not_null]

      - name: priority
        description: "Priority of the bug."
        data_type: varchar

      - name: project
        description: "Project name."
        data_type: varchar

      - name: priority_group
        description: "Categorizes priority into 'P1/2' (Highest/High) and 'P3' (others)."
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              values: ['P1/2', 'P3']

      - name: created_at
        description: "Timestamp when the bug was created."
        data_type: timestamp with time zone
        tests: [not_null]

      - name: resolved_at
        description: "Timestamp when the bug was resolved. Can be null."
        data_type: timestamp with time zone

  - name: project_velocity_and_predictability
    description: "Tracks all issues (stories, tasks, bugs, spikes) that were committed to a sprint,
     and separately, those that were delivered within that sprint's timeframe."

    config:
      contract: {enforced: true}

    columns:
      - name: sprint_id
        description: "The ID of the sprint (foreign key)."
        data_type: bigint
        tests:
          - not_null
          - relationships:
              to: ref('sprints')
              field: sprint_id
              severity: warn

      - name: sprint_name
        description: "The name of the sprint."
        data_type: varchar
        tests: [not_null]

      - name: issue_url
        description: "A clickable HTML link to the Jira issue."
        data_type: varchar
        tests: [not_null]

      - name: issue_type
        description: "The type of the issue (e.g., Story, Bug)."
        data_type: varchar
        tests: [not_null]

      - name: summary
        description: "Issue summary/title."
        data_type: varchar
        tests: [not_null]

      - name: project
        description: "Project name."
        data_type: varchar

      - name: status
        description: "Indicates if the record represents a
          'committed' or 'delivered' state for the issue in the sprint."
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              values: ["committed", "delivered"]

  - name: time_in_status
    description: "Calculates the time an issue spent in each status during a specific sprint.
     An issue's status history is broken into periods that fall within a sprint's start and end dates."

    config:
      contract: {enforced: true}

    columns:
      - name: issue_url
        description: "A clickable HTML link to the Jira issue."
        data_type: varchar
        tests: [not_null]

      - name: sprint_id
        description: "The ID of the sprint (foreign key)."
        data_type: bigint
        tests:
          - not_null
          - relationships:
              to: ref('sprints')
              field: sprint_id
              severity: warn

      - name: sprint_name
        description: "The name of the sprint."
        data_type: varchar
        tests: [not_null]

      - name: issue_id
        description: "The ID of the issue (foreign key)."
        data_type: bigint
        tests:
          - not_null
          - relationships:
              to: ref('issues')
              field: issue_id
              severity: warn

      - name: summary
        description: "Issue summary/title."
        data_type: varchar
        tests: [not_null]

      - name: status
        description: "The status the issue was in."
        data_type: varchar
        tests: [not_null]

      - name: project
        description: "Project name."
        data_type: varchar

      - name: period_start
        description: "The start of the time window for this status, clipped to the sprint's start time."
        data_type: timestamp with time zone
        tests: [not_null]

      - name: period_end
        description: "The end of the time window for this status, clipped to the sprint's completion time."
        data_type: timestamp with time zone
        tests: [not_null]

      - name: seconds_in_status
        description: "The total number of seconds the issue spent in the status during the specified period."
        data_type: bigint
        tests: [not_null]

      - name: hours_in_status
        description: "The total number of hours the issue spent in the status during the specified period."
        data_type: decimal(10, 2)
        tests: [not_null]
