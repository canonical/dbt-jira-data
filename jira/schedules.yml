schedules:
  - name: dbt_jira_prod__jira_nightly
    models:
      - stg_jira__issues
      - int_jira__issues
      - int_jira__issue_status_histories
      - int_jira__issue_priority_histories
      - int_jira__issue_resolution_histories
      - int_jira__issue_assignee_histories
      - int_jira__issue_reporter_histories
      - int_jira__issue_labels
      - issues
      # - time_in_status
      # - project_velocity_and_predictability
      # - project_correctness_and_performance
      # - opened_vs_closed_bugs
      # - efficiency
    interval: "0 4 * * *" # Every day at 4 am.
    target:
      - prod
